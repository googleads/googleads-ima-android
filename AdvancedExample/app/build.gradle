apply plugin: 'com.android.application'

android {
    namespace = 'com.google.ads.interactivemedia.v3.samples.videoplayerapp'
    compileSdk = 36

    // Java 17 required by Gradle 8+
    compileOptions {
        coreLibraryDesugaringEnabled = true
        // Required by IMA SDK v3.37.0+
        coreLibraryDesugaringEnabled = true

        // Java 17 required by Gradle 8+
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.google.ads.interactivemedia.v3.samples.videoplayerapp"
        minSdkVersion(24)
        targetSdkVersion(36)
        versionCode = 1
        versionName = "1.0"
    }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    coreLibraryDesugaring('com.android.tools:desugar_jdk_libs:2.1.5')
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.3.0"))
    implementation('androidx.appcompat:appcompat:1.7.1')
    implementation('androidx.recyclerview:recyclerview:1.4.0')
    implementation('androidx.legacy:legacy-support-v4:1.0.0')
    implementation('androidx.mediarouter:mediarouter:1.8.1')
    implementation('androidx.constraintlayout:constraintlayout:2.2.1')
    implementation('com.google.ads.interactivemedia.v3:interactivemedia:3.39.0')
}
